name: CodeAtlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ─────────────────────────────────────────────
  # Shared TypeScript Package
  # ─────────────────────────────────────────────
  shared-package:
    name: Shared Package (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/flowsync-shared
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: packages/flowsync-shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # Ingestion Lambda (TypeScript)
  # ─────────────────────────────────────────────
  ingestion-lambda:
    name: Ingestion Lambda (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/lambda/ingestion
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: infra/lambda/ingestion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # AI Processing Lambda (Python)
  # ─────────────────────────────────────────────
  ai-processing-lambda:
    name: AI Processing Lambda (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/lambda/ai_processing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: infra/lambda/ai_processing/test/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements.txt

      - name: Run tests
        run: python -m pytest test/ -v --tb=short

  # ─────────────────────────────────────────────
  # Graph Repository Tests (Python)
  # ─────────────────────────────────────────────
  graph-repository:
    name: Graph Repository Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/lambda/ai_processing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: infra/lambda/ai_processing/test/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements.txt

      - name: Run graph repository tests
        run: python -m pytest test/test_graph_repository.py -v --tb=short

      - name: Run graph ingestion tests
        run: python -m pytest test/test_graph_ingestion.py -v --tb=short

      - name: Run graph RAG tests
        run: python -m pytest test/test_graph_rag.py -v --tb=short

  # ─────────────────────────────────────────────
  # MCP Server (TypeScript)
  # ─────────────────────────────────────────────
  mcp-server:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────
  # VS Code Extension
  # ─────────────────────────────────────────────
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      # Note: Extension tests require VS Code environment
      # Run locally with: npm run vscode:prepublish && npm test

  # ─────────────────────────────────────────────
  # Infrastructure (CDK)
  # ─────────────────────────────────────────────
  infrastructure:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Synthesize CDK stack
        run: npx cdk synth
        env:
          # Use dummy values for synthesis-only
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  # ─────────────────────────────────────────────
  # Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit on all packages
        run: |
          for dir in packages/flowsync-shared infra/lambda/ingestion mcp-server frontend extension infra; do
            if [ -f "$dir/package.json" ]; then
              echo "=== Auditing $dir ==="
              cd "$dir" && npm audit --audit-level=high || true
              cd - > /dev/null
            fi
          done

      - name: Run Python safety check
        run: |
          pip install safety
          # Check Python dependencies if requirements.txt exists
          find . -name "requirements.txt" -exec safety check -r {} \; || true

  # ─────────────────────────────────────────────
  # Summary
  # ─────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: 
      - shared-package
      - ingestion-lambda
      - ai-processing-lambda
      - graph-repository
      - mcp-server
      - frontend
      - vscode-extension
      - infrastructure
      - security-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Checking job statuses..."
          # GitHub Actions automatically fails if any needed job fails
          echo "All required jobs completed successfully!"