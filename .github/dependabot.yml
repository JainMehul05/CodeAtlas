# Dependabot configuration for automated dependency updates
# This file enables Dependabot to keep dependencies up to date

version: 2
updates:
  # npm dependencies for all packages
  - package-ecosystem: "npm"
    directory: "/packages/flowsync-shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "shared-package"
    commit-message:
      prefix: "[shared] "
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "jest"
          - "ts-jest"
          - "eslint*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/infra/lambda/ingestion"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "ingestion-lambda"
    commit-message:
      prefix: "[ingestion] "

  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "mcp-server"
    commit-message:
      prefix: "[mcp] "

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    commit-message:
      prefix: "[frontend] "
    groups:
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      ui:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "extension"
    commit-message:
      prefix: "[extension] "

  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "infrastructure"
    commit-message:
      prefix: "[infra] "
    groups:
      cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
        update-types:
          - "minor"
          - "patch"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/infra/lambda/ai_processing"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "ai-processing"
    commit-message:
      prefix: "[ai-processing] "
    groups:
      aws:
        patterns:
          - "boto3"
          - "botocore"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "pytest*"
          - "mock"
        update-types:
          - "minor"
          - "patch"